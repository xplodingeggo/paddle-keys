name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    # 22.04 keeps the glibc requirement low (2.35) for the release build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libudev-dev libayatana-appindicator3-dev gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: cargo test --workspace
      - run: cargo test -p paddle-keys-steam --target i686-unknown-linux-gnu
      - run: cargo build --release --workspace
      - run: cargo build --release -p paddle-keys-steam --target i686-unknown-linux-gnu
      - name: Package
        run: |
          v=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; fi
          d=paddle-keys-$v-linux-x86_64
          mkdir "$d"
          cp target/release/paddle-keys "$d/"
          cp target/release/libpaddle_keys_steam.so "$d/libpaddle_keys_steam64.so"
          cp target/i686-unknown-linux-gnu/release/libpaddle_keys_steam.so "$d/libpaddle_keys_steam32.so"
          cp README.md LICENSE packaging/linux/install.sh packaging/linux/70-paddle-keys.rules packaging/linux/paddle-keys.desktop "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          v=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; fi
          d=paddle-keys-$v-windows-x64
          mkdir "$d"
          cp target/release/paddle-keys.exe target/release/paddle_keys_steam.dll README.md LICENSE "$d/"
          7z a -tzip "$d.zip" "$d" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes=../.github/release-notes/$GITHUB_REF_NAME.md
          if [ -f "$notes" ]; then n="--notes-file $notes"; else n="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $n --verify-tag ./*.tar.gz ./*.zip SHA256SUMS.txt
