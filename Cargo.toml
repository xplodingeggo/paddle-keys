[package]
name = "paddle-keys"
version = "0.2.0"
edition = "2024"
description = "Use the 8BitDo Ultimate 2 Wireless back paddles as F13-F16 keys while staying in XInput mode"
license = "MIT"
repository = "https://github.com/xplodingeggo/paddle-keys"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tray-icon = "0.19"
tao = "0.30"

[target.'cfg(windows)'.dependencies]
hidapi = "2"
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Services"] }
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
# hidraw backend: no libusb, and the interface number comes from sysfs
hidapi = { version = "2", default-features = false, features = ["linux-native"] }
evdev = "0.13"
libc = "0.2"

[workspace]
members = ["steam-hook"]
