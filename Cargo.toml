[package]
name = "paddle-keys"
version = "0.1.0"
edition = "2024"
description = "Use the 8BitDo Ultimate 2 Wireless back paddles as F13-F16 keys while staying in XInput mode"
license = "MIT"
repository = "https://github.com/xplodingeggo/paddle-keys"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }
tray-icon = "0.19"
tao = "0.30"
winreg = "0.52"
